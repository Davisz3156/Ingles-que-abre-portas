<style>
:root{
  --ink:#0b1b3a;--mut:#5d6b8a;--ac:#1f6bf2;--acd:#1250b8;
  --red:#e53946;--ok:#16a870;--line:#dfe7f5;
  --gold:#f59e0b;--gold-bg:#fffbeb;--gold-bdr:#fde68a;
  --surface:rgba(255,255,255,.88);--glass:rgba(255,255,255,.72);
  --shadow:0 12px 40px rgba(20,60,140,.12);
  --shadow-lg:0 20px 60px rgba(20,60,140,.18);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Inter','Segoe UI',system-ui,sans-serif;line-height:1.5;background:#eaf2ff;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* === BACKGROUND === */
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#e6f0ff 0%,#cfe2ff 30%,#f3f8ff 60%,#d6e6ff 100%);background-size:300% 300%;animation:mv 14s ease-in-out infinite;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 18s ease-in-out infinite}
.bg i:nth-child(1){width:360px;height:360px;background:#2b7bff;left:-100px;top:6%}
.bg i:nth-child(2){width:260px;height:260px;background:#e53946;right:-80px;top:50%;opacity:.18;animation-delay:-6s}
.bg i:nth-child(3){width:340px;height:340px;background:#7fb2ff;left:28%;bottom:-120px;animation-delay:-11s}
@keyframes mv{50%{background-position:100% 50%}}
@keyframes fl{50%{transform:translate(40px,-50px) scale(1.05)}}

/* === LAYOUT === */
main{max-width:560px;margin:0 auto;padding:10px 16px 40px;min-height:100vh}

/* === HEADER === */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.top button{width:40px;height:40px;border:0;background:none;font-size:30px;line-height:1;color:var(--mut);cursor:pointer;transition:color .2s}
.top button:hover{color:var(--ink)}
.top img{width:44px;height:44px}
.top span{width:40px}

/* === BARRA PROGRESSO === */
.bar{height:10px;background:rgba(255,255,255,.7);border-radius:6px;margin:4px 0 22px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(4px)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6bf2,#4a9bff,#7fb2ff);border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* === TIPOGRAFIA === */
h1,h2{text-align:center;letter-spacing:-.03em;line-height:1.15;margin:.3em 0 .6em}
h1{font-size:30px;font-weight:900}
h2{font-size:24px;font-weight:800}
.red{color:var(--red)}
.c{text-align:center}

/* === CARDS === */
.card{background:var(--surface);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}

/* === OPÇÕES === */
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;margin:0 0 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;box-shadow:0 4px 16px rgba(20,60,140,.06);transition:all .2s cubic-bezier(.4,0,.2,1)}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateY(-3px);box-shadow:0 8px 24px rgba(31,107,242,.15)}
.opt .ic{font-size:28px;width:36px;text-align:center}
.opt .tx{flex:1}.opt small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.opt .bx{width:30px;height:30px;border:1.5px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;transition:all .2s}
.opt.sel{border-color:var(--ac);background:rgba(31,107,242,.04)}.opt.sel .bx{background:var(--ac);border-color:var(--ac)}.opt.sel .bx:after{content:"✓"}
.opt.ok{border-color:var(--ok);background:rgba(22,168,112,.06)}.opt.ok .bx{background:var(--ok);border-color:var(--ok)}.opt.ok .bx:after{content:"✓"}
.opt.no{border-color:var(--red);background:rgba(229,57,70,.04)}.opt.no .bx{background:var(--red);border-color:var(--red)}.opt.no .bx:after{content:"✕"}

/* === OPÇÕES COM FOTOS (TELA DE IDADE) === */
.opt-age{flex-direction:column;align-items:stretch;padding:12px;gap:12px;margin-bottom:14px}
.opt-age-photos{display:flex;gap:10px;width:100%}
.opt-age-img-wrap{position:relative;flex:1 1 0;min-width:0;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#e6eeff 0%,#d5e3ff 100%);box-sizing:border-box;transition:transform .2s ease,box-shadow .2s ease}
.opt-age-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;z-index:2;transition:transform .25s ease;pointer-events:none;-webkit-user-drag:none;user-select:none;filter:none!important}
.opt-age-ph{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#e6eeff 0%,#d5e3ff 100%);border-radius:14px;z-index:1;transition:transform .25s ease;pointer-events:none;user-select:none}
.opt-age-img-wrap.ph .opt-age-ph{display:grid}
.opt-age-ph-ic{font-size:36px;line-height:1;filter:drop-shadow(0 2px 6px rgba(20,60,140,.12))}
.opt-age-bottom{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 4px}
.opt-age-bottom .tx{flex:1;font-size:16px;font-weight:700;color:var(--ink);text-align:left}
.opt-age:hover:not(:disabled) .opt-age-img-wrap img,.opt-age:hover:not(:disabled) .opt-age-ph,.opt-age:active:not(:disabled) .opt-age-img-wrap img,.opt-age:active:not(:disabled) .opt-age-ph{transform:scale(1.02)}
.opt-age.sel .opt-age-img-wrap{box-shadow:0 0 0 2px var(--ac)}

/* === ABA LATERAL DE ROLAGEM === */
.scroll-tab{position:fixed;top:62%;transform:translateY(-50%);right:max(0px,env(safe-area-inset-right));width:28px;height:104px;border-radius:14px 0 0 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid var(--line);border-right:none;box-shadow:0 4px 16px rgba(20,60,140,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 2px 7px;cursor:pointer;z-index:99;touch-action:manipulation;pointer-events:auto;transition:opacity .2s ease,transform .2s ease;color:var(--ac);box-sizing:border-box}
@media(min-width:620px){.scroll-tab{right:max(12px,calc(50vw - 320px));border-radius:14px;border-right:1.5px solid var(--line)}}
.scroll-tab:hover{background:#fff;border-color:var(--ac);box-shadow:0 6px 20px rgba(31,107,242,.2)}
.scroll-tab-chevrons{display:flex;flex-direction:column;align-items:center}
.scroll-tab-arrow{display:block;color:var(--ac);animation:scrollWave 1.6s ease-in-out infinite}
.scroll-tab-arrow.a2{animation-delay:.3s;margin-top:-3px}
@keyframes scrollWave{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(5px);opacity:1}}
.scroll-tab-track{width:2.5px;height:24px;background:rgba(31,107,242,.15);border-radius:99px;overflow:hidden;position:relative;margin:3px 0}
.scroll-tab-fill{width:100%;height:0%;background:var(--ac);border-radius:99px;transition:height .1s linear}
.scroll-tab-txt{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--acd);line-height:1;writing-mode:vertical-rl;text-orientation:upright;user-select:none;-webkit-user-select:none}
.scroll-fade{position:fixed;bottom:0;left:0;right:0;height:48px;background:linear-gradient(to bottom,rgba(234,242,255,0) 0%,rgba(234,242,255,.95) 100%);pointer-events:none;z-index:85;transition:opacity .2s ease}
.scroll-tab-hidden,.scroll-fade-hidden{opacity:0!important;pointer-events:none!important;transform:translateY(-50%) translateX(10px)}

/* === BOTÕES === */
.btn{display:block;width:100%;padding:17px;border:0;border-bottom:5px solid var(--acd);border-radius:14px;font:inherit;font-weight:800;font-size:17px;background:linear-gradient(135deg,#1f6bf2,#3b82f6);color:#fff;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(31,107,242,.3)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px;margin-top:12px}
.btn.sec:hover{background:#fff;border-color:var(--ac)}
.btn.cta-main{font-size:19px;padding:20px;background:linear-gradient(135deg,#16a870,#0d9460);border-bottom-color:#0a7a4d;letter-spacing:-.01em;animation:ctaPulse 3s ease-in-out infinite}
@keyframes ctaPulse{0%,100%{box-shadow:0 4px 20px rgba(22,168,112,.2)}50%{box-shadow:0 8px 40px rgba(22,168,112,.4)}}

/* === FOCUS === */
:focus-visible{outline:3px solid #7fb2ff;outline-offset:2px}

/* === FEEDBACK === */
.fb{margin:4px 0 14px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;animation:up .35s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fb-tip{font-size:13px;color:var(--acd);margin-top:6px;font-weight:600;display:block}

/* === TAGS === */
.tag{display:inline-block;background:#e3eeff;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--acd)}
.tag.hot{background:var(--red);color:#fff;animation:tagPulse 2s ease-in-out infinite}
@keyframes tagPulse{0%,100%{opacity:1}50%{opacity:.8}}

/* === NÍVEL === */
.lvl{font-size:38px;font-weight:900;letter-spacing:-.03em;text-align:center;margin:0}

/* === CHIPS === */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;opacity:0;animation:pp .4s forwards}
.chip.g{background:#e3f7ee;color:#0d7a52}.chip.r{background:#fff0e0;color:#a85a00}

/* === GRÁFICOS SVG === */
svg{width:100%;height:auto;display:block}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s .2s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.pop{opacity:0;animation:pp .4s 1.5s forwards}
@keyframes pp{to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.6s 1.8s infinite}
@keyframes pl{50%{transform:scale(1.7);opacity:.4}}

/* === MARCADOR DO CAMINHO === */
.rise-wrap{position:relative}
.rise-marker{position:absolute;width:13px;height:13px;transform:translate(-50%,-50%) scale(0.6);opacity:0;pointer-events:none;z-index:2;animation:markerScale .25s 1.8s cubic-bezier(.34,1.56,.64,1) forwards}
.rise-dot{width:13px;height:13px;background:var(--ac);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(31,107,242,.4);box-sizing:border-box}
.rise-pulse-ring{position:absolute;inset:-8px;border-radius:50%;background:rgba(31,107,242,.25);pointer-events:none;animation:ringPulse 2.4s 2.05s ease-out infinite}
@keyframes ringPulse{0%{transform:scale(0.7);opacity:0.8}50%{transform:scale(1.85);opacity:0}100%{transform:scale(1.85);opacity:0}}
@keyframes markerScale{from{transform:translate(-50%,-50%) scale(0.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.rise-chip{position:absolute;background:#ffffff;border:1.5px solid var(--ac);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 4px 14px rgba(20,60,140,.1);transform:translate(calc(-75% + var(--chip-shift,0px)), -100%);margin-top:-11px;opacity:0;pointer-events:none;z-index:3;animation:chipFade .2s 2.05s ease-out forwards}
.rise-chip-tip{position:absolute;bottom:-5px;left:75%;width:7px;height:7px;background:#fff;border-right:1.5px solid var(--ac);border-bottom:1.5px solid var(--ac);transform:translateX(calc(-50% + var(--tip-shift,0px))) rotate(45deg)}
@keyframes chipFade{from{opacity:0}to{opacity:1}}
@media(max-width:350px){.rise-chip{padding:4px 8px;font-size:13px}}

/* === PROVA SOCIAL ESPECIALISTAS === */
.card-social-img{background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:0;overflow:hidden;box-shadow:var(--shadow);margin-bottom:10px}
.card-social-img img{display:block;width:100%;height:auto;max-width:592px;margin:0 auto}
.social-caption{font-size:12px;color:#405070;line-height:1.45;margin:0 0 14px}
.social-bridge{font-size:15px;font-weight:700;color:var(--ink);line-height:1.4;margin:12px 0 16px}

/* === CHECKLIST === */
ul.ck{list-style:none;padding:0;margin:10px 0}
ul.ck li{padding-left:28px;position:relative;margin:10px 0;line-height:1.4}
ul.ck li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}

/* === PREÇO === */
.de{color:var(--mut);text-decoration:line-through;text-align:center;font-size:18px}
.por{font-size:44px;font-weight:900;letter-spacing:-.03em;text-align:center;color:var(--ok)}
.preco-box{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:2px solid #bbf7d0;border-radius:18px;padding:20px;margin:16px 0;text-align:center}


/* === SMALL === */
.small{font-size:12px;color:var(--mut)}

/* === FOOTER === */
footer{margin-top:24px;text-align:center}footer a{color:var(--mut);margin:0 8px;text-decoration:none;transition:color .2s}footer a:hover{color:var(--ac)}

/* === MÓDULOS (premium) === */
.mod-section{margin:20px 0}
.mod-section h3{font-size:15px;color:var(--acd);text-align:center;font-weight:800;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
.mod-not-pdf{text-align:center;font-size:13.5px;line-height:1.45;color:#1e3a5f;background:linear-gradient(135deg,#eff6ff,#e0ecff);border:1px solid #bfdbfe;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-weight:500}
.mod-not-pdf strong{color:var(--acd);font-weight:800}
.mod-pills{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mod-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);color:var(--acd);padding:5px 14px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(20,60,140,.04)}
.mod-card{border:1.5px solid var(--line);border-radius:18px;margin:12px 0;background:var(--surface);overflow:hidden;transition:all .3s;position:relative}
.mod-card:hover{box-shadow:var(--shadow)}
.mod-card.recommended{border-color:var(--ac);border-width:2px;background:linear-gradient(135deg,rgba(31,107,242,.02),rgba(31,107,242,.06))}
.mod-card.recommended::before{content:"⭐ RECOMENDADO PARA VOCÊ";position:absolute;top:0;right:0;background:linear-gradient(135deg,var(--ac),#3b82f6);color:#fff;font-size:10px;font-weight:800;padding:4px 12px;border-radius:0 16px 0 12px;letter-spacing:.04em}
.mod-header{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;list-style:none}
.mod-header::-webkit-details-marker{display:none}
.mod-num{font-weight:900;color:var(--ac);font-size:22px;width:38px;height:38px;display:grid;place-items:center;background:#e3eeff;border-radius:10px;flex-shrink:0}
.mod-info{flex:1;min-width:0}
.mod-info b{display:block;font-size:16px;line-height:1.3;color:var(--ink)}
.mod-info .mod-benefit{display:block;font-size:13px;color:var(--mut);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-count{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ac);background:#eef4ff;border:1px solid #dbeafe;padding:2px 8px;border-radius:6px;margin-top:4px}
.mod-arrow{font-size:22px;color:var(--mut);transition:transform .2s;flex-shrink:0}
details[open] .mod-arrow{transform:rotate(45deg)}
.mod-body{padding:0 16px 16px}
.mod-body .mod-desc{margin:0 0 10px;font-size:14px;color:var(--ink);line-height:1.5}
.mod-aulas-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:8px 0 6px}
.mod-aulas-list{list-style:none;padding:0;margin:0 0 10px}
.mod-aulas-list li{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:6px;background:#f8faff;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.mod-play-icon{font-size:10px;color:var(--ac);background:#e3eeff;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;flex-shrink:0}
.mod-aula-name{flex:1;line-height:1.3}
.mod-body .mod-pain{font-size:13px;color:var(--acd);font-weight:600;font-style:italic;margin-top:8px;padding:8px 12px;background:#e3eeff;border-radius:10px}
label.mod-want{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--ac);margin-top:10px;cursor:pointer;padding:8px 12px;background:#f0f7ff;border-radius:10px;transition:background .2s}
label.mod-want:hover{background:#e3eeff}

/* === DEPOIMENTOS === */
.scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{height:4px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.dep{flex:0 0 85%;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative}
.dep::before{content:"“";position:absolute;top:10px;right:16px;font-size:48px;color:var(--ac);opacity:.15;font-family:Georgia,serif;line-height:1}
.dep .dep-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dep img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.dep img.pr{width:100%;height:auto;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
.av{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#3b82f6);color:#fff;font-weight:800;font-size:20px;flex-shrink:0}
.dep .dep-meta{flex:1}
.dep .dep-meta b{display:block;font-size:15px}
.dep small{display:block;color:var(--mut);font-size:13px}
.dep .dep-text{font-size:14px;color:var(--ink);line-height:1.5;margin:0 0 10px;font-style:italic}
.dep .dep-result{display:inline-block;background:#e3f7ee;color:#0d7a52;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}

/* === GARANTIA === */
.garantia-box{background:linear-gradient(135deg,var(--gold-bg),#fef3c7);border:2px solid var(--gold-bdr);border-radius:18px;padding:18px;margin:16px 0;text-align:center}
.garantia-box .shield{font-size:36px;margin-bottom:6px}
.garantia-box b{display:block;font-size:16px;color:#92400e}
.garantia-box p{font-size:13px;color:#78350f;margin:4px 0 0}

/* === SOCIAL PROOF COUNTER === */
.social-counter{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0;padding:10px;background:rgba(22,168,112,.06);border:1px solid rgba(22,168,112,.15);border-radius:12px;font-size:13px;font-weight:600;color:var(--ok)}
.social-counter .dot{width:8px;height:8px;background:var(--ok);border-radius:50%;animation:dotPulse 1.5s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* === STAT CARD === */
.stat .big{font-size:44px;font-weight:900;letter-spacing:-.03em;color:var(--ac);text-align:center}

/* === BÔNUS (cartões em coluna) === */
.bonus-section-title{font-size:20px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink)}
.bonus-list{display:flex;flex-direction:column;gap:14px;margin:12px 0}

/* ===== TELEMETRIA & META PIXEL HELPER ===== */
const _pixelCounts={};
const _sessionMemory=new Set();
function _hasSessionKey(k){
  try{return !!sessionStorage.getItem(k)}catch(_){return _sessionMemory.has(k)}
}
function _setSessionKey(k){
  try{sessionStorage.setItem(k,"1")}catch(_){_sessionMemory.add(k)}
}
if(/[?&]pixel_debug=1\b/.test(location.search)){
  try{console.log("[Pixel Debug] Evento disparado: PageView",{id:"1471201201859881"})}catch(_){}
}
function trackPixel(tipo,nome,params,opts){
  const isDebug=/[?&]pixel_debug=1\b/.test(location.search);

  if(opts&&opts.oncePerSession){
    const key="pixel_"+nome;
    if(_hasSessionKey(key))return;
    _setSessionKey(key);
  }
  if(opts&&opts.oncePerStep!==undefined){
    const key="pixel_step_"+opts.oncePerStep;
    if(_hasSessionKey(key))return;
    _setSessionKey(key);
  }

  _pixelCounts[nome]=(_pixelCounts[nome]||0)+1;

  if(isDebug){
    try{console.log(`[Pixel Debug] Evento disparado: ${nome} (disparo #${_pixelCounts[nome]})`,params||{})}catch(_){}
  }

  try{
    if(window.fbq&&typeof window.fbq==="function"){
      _internalTrack=true;
      try{
        if(tipo==="track"){
          if(params)window.fbq("track",nome,params);
          else window.fbq("track",nome);
        }else{
          if(params)window.fbq("trackCustom",nome,params);
          else window.fbq("trackCustom",nome);
        }
      }finally{
        _internalTrack=false;
      }
    }
  }catch(_){}
}
const track=(e,params)=>trackPixel("trackCustom",e,params);

/* ===== COORDENAÇÃO META PIXEL + UTMIZEY PIXEL ===== */
let _pixelJsIcFiredAt=0;
let _fallbackIcFiredAt=0;
let _internalTrack=false;
(function setupFbqCoordinator(){
  const orig=window.fbq;
  if(typeof orig!=="function"||orig.__coordinated)return;
  const wrapped=function(cmd,ev,params,opts){
    if(!_internalTrack&&cmd==="track"){
      const isDebug=/[?&]pixel_debug=1\b/.test(location.search);
      if(ev==="PageView"){
        if(isDebug){
          try{console.log("[Pixel Debug] PageView duplicado do UTMizey Pixel suprimido (já enviado no head)")}catch(_){}
        }
        return;
      }
      if(ev==="InitiateCheckout"){
        const now=Date.now();
        if(now-_fallbackIcFiredAt<1500){
          if(isDebug){
            try{console.log("[Pixel Debug] InitiateCheckout duplicado suprimido (já enviado no fallback)")}catch(_){}
          }
          return;
        }
        _pixelJsIcFiredAt=now;
        if((!params||!Object.keys(params).length)&&typeof CFG.OFFER_VALUE==="number"){
          params={content_name:"Inglês que Abre Portas",currency:"BRL",value:CFG.OFFER_VALUE};
        }
        _pixelCounts[ev]=(_pixelCounts[ev]||0)+1;
        if(isDebug){
          try{console.log(`[Pixel Debug] Evento disparado via UTMizey Pixel (com CAPI): ${ev} (disparo #${_pixelCounts[ev]})`,params||{},opts||{})}catch(_){}
        }
        return orig.call(this,cmd,ev,params,opts);
      }
      if(ev==="Lead"){
        _setSessionKey("pixel_Lead");
      }
    }
    return orig.apply(this,arguments);
  };
  wrapped.__coordinated=true;
  const proxiedProps=new Set(["callMethod","queue","getState","push","loaded","version","instance"]);
  for(const k of Object.keys(orig)){
    if(!proxiedProps.has(k)&&!(k in wrapped))wrapped[k]=orig[k];
  }
  proxiedProps.forEach(prop=>{
    try{
      Object.defineProperty(wrapped,prop,{
        configurable:true,
        enumerable:true,
        get(){return orig[prop]},
        set(v){orig[prop]=v}
      });
    }catch(_){}
  });
  if(window._fbq===orig)window._fbq=wrapped;
  window.fbq=wrapped;
})();

/* ===== CHECKOUT / REDIRECIONAMENTO SEGURO (GGCHECKOUT + UTMIZEY) ===== */
let _checkoutRedirecting=false;
let _lastCheckoutTrackAt=0;
function applyUtmizeyParams(url){
  try{
    if(window.__utmizey&&typeof window.__utmizey.decorate==="function"){
      return window.__utmizey.decorate(url);
    }
  }catch(_){}
  return url;
}
function getGGCheckoutUrl(el){
  if(!el)return null;
  const href=el.getAttribute("href")||"";
  const dataUrl=el.dataset?(el.dataset.checkoutUrl||el.dataset.checkout||el.dataset.href||el.dataset.url||el.dataset.link||""):"";
  const url=href||dataUrl;
  if(!url||url==="#"||url.startsWith("#"))return null;
  if((CFG.CHECKOUT_URL&&CFG.CHECKOUT_URL!=="#"&&url.indexOf(CFG.CHECKOUT_URL)===0)||/ggcheckout/i.test(url)){
    return url;
  }
  return null;
}
function handleGGCheckoutClick(e){
  if(e.defaultPrevented)return;
  if(e.type==="click"&&e.button!==0)return;
  if(e.type==="auxclick"&&e.button!==1)return;

  const targetEl=e.target&&e.target.closest?e.target.closest("a, button, [data-checkout-url], [data-checkout], [data-href], [data-url], [data-link]"):null;
  const rawCheckoutUrl=getGGCheckoutUrl(targetEl);
  if(!rawCheckoutUrl)return;

  const checkoutUrl=applyUtmizeyParams(rawCheckoutUrl);
  if(targetEl.tagName==="A"&&checkoutUrl!==rawCheckoutUrl){
    try{targetEl.setAttribute("href",checkoutUrl);}catch(_){}
  }

  const opensNewTab=e.type==="auxclick"||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||targetEl.getAttribute("target")==="_blank";
  if(_checkoutRedirecting){
    if(!opensNewTab)e.preventDefault();
    return;
  }

  const now=Date.now();
  if(now-_lastCheckoutTrackAt<1000){
    if(!opensNewTab)e.preventDefault();
    return;
  }
  _lastCheckoutTrackAt=now;

  const checkoutParams=typeof CFG.OFFER_VALUE==="number"
    ?{content_name:"Inglês que Abre Portas",currency:"BRL",value:CFG.OFFER_VALUE}
    :undefined;
  const sentByUtmizeyPixel=(now-_pixelJsIcFiredAt)<500;
  if(!sentByUtmizeyPixel){
    _fallbackIcFiredAt=now;
    trackPixel("track","InitiateCheckout",checkoutParams);
  }

  if(!opensNewTab){
    e.preventDefault();
    _checkoutRedirecting=true;
    let done=false;
    const nav=()=>{
      if(!done){
        done=true;
        window.location.href=checkoutUrl;
      }
    };
    setTimeout(nav,250);
    setTimeout(()=>{_checkoutRedirecting=false;},3000);
  }
}
document.addEventListener("click",handleGGCheckoutClick);
document.addEventListener("auxclick",handleGGCheckoutClick);
window.addEventListener("pageshow",()=>{_checkoutRedirecting=false;});

/* ===== BLOCO DE VAGAS REFINADO ===== */
function urgencyBarHTML(){
  if(!CFG.VAGAS||CFG.VAGAS<=0)return "";
  const preenchidas=CFG.VAGAS_PREENCHIDAS;
  const hasProg=preenchidas!==null&&preenchidas!==undefined&&typeof preenchidas==="number";
  const clamped=hasProg?Math.min(CFG.VAGAS,Math.max(0,preenchidas)):null;
  const pct=clamped!==null?Math.round((clamped/CFG.VAGAS)*100):null;

  return `<div class="urgency-bar">
    <div class="urgency-head">
      <span class="urgency-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M3 21h18M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M14 11v.01"/>
        </svg>
      </span>
      <h3 class="urgency-title">Turma limitada a ${CFG.VAGAS} vagas</h3>
    </div>
    <div class="urgency-sub">Quando as vagas acabarem, o acesso fecha e o preço volta ao normal.</div>
    ${pct!==null?`
    <div class="urgency-progress" role="progressbar" aria-valuenow="${clamped}" aria-valuemin="0" aria-valuemax="${CFG.VAGAS}" aria-label="Vagas preenchidas">
      <div class="urgency-pbar-fill" style="width:${pct}%"></div>
    </div>
    <div class="urgency-progress-text">${clamped} de ${CFG.VAGAS} vagas preenchidas</div>
    `:""}
  </div>`;
}

/* ===== FAQ (PERGUNTAS FREQUENTES) ===== */
function faqHTML(){
  if(!CFG.FAQ||!CFG.FAQ.length)return "";
  const items=CFG.FAQ.filter(item=>{
    const isVagas=item.q.toLowerCase().includes("vagas");
    if(isVagas&&(!CFG.VAGAS||CFG.VAGAS<=0))return false;
    return true;
  }).map(item=>{
    let ans=item.a;
    const isVagas=item.q.toLowerCase().includes("vagas");
    if(isVagas&&CFG.VAGAS>0){
      ans=ans.replace(/\b\d+\s*vagas\b/i,`${CFG.VAGAS} vagas`);
    }
    return `<details class="faq-item">
      <summary class="faq-summary">
        <span class="faq-q">${item.q}</span>
        <span class="faq-icon" aria-hidden="true">+</span>
      </summary>
      <div class="faq-a"><p>${ans}</p></div>
    </details>`;
  }).join("");

  return `<div class="card faq-card">
    <h2 class="faq-title">Perguntas frequentes</h2>
    <div class="faq-list">${items}</div>
  </div>`;
}

function start(){
  S.i=0;S.ans=[];S.flow=[OBJ];S.cur=OBJ;recalc(0);
  trackPixel("track","ViewContent",{content_name:"Quiz Inglês que Abre Portas",content_category:"Quiz"},{oncePerSession:true});
  step();
}
function recalc(upto){S.score=0;S.tags={};S.res=[];S.flow.forEach((s,i)=>{const k=S.ans[i];if(i>=upto||s.info||k===undefined)return;if(s.c!==undefined){const ok=k===s.c;if(ok)S.score++;S.res.push([s.sk,ok])}if(s.tag)S.tags[s.tag]=k})}
function bind(){const b=document.getElementById("bk");if(b)b.onclick=()=>{const v=document.getElementById("vCard");if(v)v.pause();back()}}
function back(){if(S.i<1)return;S.i--;if(S.flow[S.i].info&&S.i>0)S.i--;S.cur=S.flow[S.i];S.ans[S.i]=undefined;recalc(S.i);step()}
function preloadVideo(){
  if(document.getElementById("vPreload")||!CFG.VIDEO_URL)return;
  const v=document.createElement("video");
  v.id="vPreload";
  v.src=CFG.VIDEO_URL;
  v.preload="auto";
  v.muted=true;
  v.playsInline=true;
  v.setAttribute("aria-hidden","true");
  v.style.cssText="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;";
  document.body.appendChild(v);
  v.load();
}
function initVideo(){

  const playBtn=document.getElementById("vPlayBtn");

  const pre=document.getElementById("vPreload");
  if(pre)pre.pause();

  vid.muted=false;

  if(!vid.getAttribute("poster")){
    vid.addEventListener("loadedmetadata",()=>{
      if(vid.currentTime===0)try{vid.currentTime=0.01}catch(_){}
    });
  }

  const togglePlay=()=>{
    if(vid.ended){
      vid.currentTime=0;
      vid.muted=false;
      vid.play().catch(()=>{
        vid.muted=true;
        if(sndBtn)sndBtn.textContent="🔇";
        vid.play().catch(()=>{});
      });
    }else if(vid.paused){
      vid.muted=false;
      vid.play().catch(()=>{
        vid.muted=true;
        if(sndBtn)sndBtn.textContent="🔇";
        vid.play().catch(()=>{});
      });
    }else{
      vid.pause();
    }
  };
  vid.onclick=togglePlay;
  if(playBtn)playBtn.onclick=e=>{e.stopPropagation();togglePlay()};
  if(sndBtn){
    sndBtn.onclick=e=>{
      e.stopPropagation();
      vid.muted=!vid.muted;
      sndBtn.textContent=vid.muted?"🔇":"🔊";
      sndBtn.setAttribute("aria-label",vid.muted?"Ativar som":"Desativar som");
    };
  }

  vid.pause();
  if(playBtn)playBtn.style.display="grid";

  vid.addEventListener("play",()=>{
    if(playBtn)playBtn.style.display="none";
  });
  vid.addEventListener("pause",()=>{
    if(!vid.ended&&playBtn)playBtn.style.display="grid";
  });
  let tPlay=false,tHalf=false,tEnd=false;
  vid.addEventListener("play",()=>{
    if(!tPlay){tPlay=true;track("VideoPlay")}
  });
  vid.addEventListener("timeupdate",()=>{
    if(!tHalf&&vid.duration>0&&vid.currentTime>=vid.duration/2){
      tHalf=true;
      track("VideoMetade");
    }
  });
  vid.addEventListener("ended",()=>{
    if(!tEnd){tEnd=true;track("VideoCompleto")}
    if(playBtn)playBtn.style.display="grid";
    if(nx){
      nx.classList.remove("btn-pulse");
      void nx.offsetWidth;
      nx.classList.add("btn-pulse");
    }
  });
}
function updateRiseMarker(){
  const p=document.getElementById("risePath"),w=document.getElementById("riseWrap"),m=document.getElementById("riseMarker"),c=document.getElementById("riseChip");
  if(!p||!w||!m||!c)return;
  const len=p.getTotalLength(),pt=p.getPointAtLength(len*0.45);
  const px=(pt.x/320)*100,py=(pt.y/120)*100;
  m.style.left=px+"%";m.style.top=py+"%";
  const wrapW=w.clientWidth,chipW=c.offsetWidth||150,xPos=(px/100)*wrapW;
  let sX=0;
  const leftEdge=xPos-0.75*chipW,rightEdge=xPos+0.25*chipW;
  if(leftEdge<6)sX=6-leftEdge;
  else if(rightEdge>wrapW-6)sX=(wrapW-6)-rightEdge;
  c.style.left=px+"%";c.style.top=py+"%";
  c.style.setProperty("--chip-shift",sX+"px");
  c.style.setProperty("--tip-shift",(-sX)+"px");
}
function initRiseMarker(){
  updateRiseMarker();
  if(window.requestAnimationFrame)requestAnimationFrame(updateRiseMarker);
  if(!window._riseBound){
    window.addEventListener("resize",updateRiseMarker);
    if(window.ResizeObserver)new ResizeObserver(updateRiseMarker).observe(document.body);
    window._riseBound=true;
  }
}
